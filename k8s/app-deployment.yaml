apiVersion: apps/v1
kind: Deployment
metadata:
  name: contador-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: contador
  template:
    metadata:
      labels:
        app: contador
    spec:
      containers:
        - name: contador
          image: contador:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5050
          env:
            - name: REDIS_HOST
              value: "redis"
